name: Android APK - Direct SDK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve preinstalled Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "SDK_ROOT=$SDK_ROOT"

          SDKMANAGER=""

          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; do

            if [[ -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi

          done

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -mindepth 3 \
                -maxdepth 3 \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null |
              sort -V |
              tail -1 || true
            )"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager was not found."
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

            find "$SDK_ROOT/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -name sdkmanager \
              -print \
              2>/dev/null || true

            exit 1
          fi

          SDK_BIN="$(dirname "$SDKMANAGER")"

          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDK_BIN=$SDK_BIN"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$ANDROID_SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null || true

      - name: Install Android SDK / NDK / CMake
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Validate project layout
        shell: bash
        run: |
          set -euo pipefail

          required=(
            settings.gradle
            build.gradle
            gradle.properties
            app/build.gradle
            app/proguard-rules.pro
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/sacalculator/android/MainActivity.java
            app/src/main/java/com/sacalculator/android/NativeBridge.java
            app/src/main/cpp/CMakeLists.txt
            app/src/main/cpp/native_bridge.cpp
            app/src/main/cpp/sa_calculator.cpp
            app/src/main/cpp/sa_calculator.hpp
          )

          for f in "${required[@]}"; do
            test -f "$f" || {
              echo "Missing required file: $f"
              exit 1
            }
          done

          test -d .github/workflows

          grep -q "com.android.application.*9.3.0" build.gradle
          grep -q "compileSdk 37" app/build.gradle
          grep -q "ndkVersion '28.2.13676358'" app/build.gradle

          if grep -Rqs "android-actions/setup-android@v3" .github/workflows; then
            echo "ERROR: old setup-android workflow is still present."
            exit 1
          fi

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail

          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

          ls -lh app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-Calculator-debug-apk
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-Calculator-release-unsigned-apk
          if-no-files-found: error
          path: app/build/outputs/apk/release/*-unsigned.apk
          retention-days: 14
